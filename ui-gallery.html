        const langSelect = document.getElementById('langSelect');

        function applyLanguage(lang) {
            const targetLang = (lang === 'en-us') ? 'en' : (translations[lang] ? lang : 'ja');
            const t = translations[targetLang] || translations['ja'];

            document.getElementById('page-title').innerText = t.title;

            // data-i18n 属性を持った要素を一括で書き換え
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined && t[key] !== "") {
                    el.innerText = t[key];
                }
            });
        }

        // 初期読み込み時の言語適用
        const savedLang = localStorage.getItem('utaun_lang') || 'ja';
        if (langSelect) {
            langSelect.value = savedLang;
            applyLanguage(savedLang);

            // セレクトボックス変更時
            langSelect.addEventListener('change', (e) => {
                const lang = e.target.value;
                localStorage.setItem('utaun_lang', lang);
                applyLanguage(lang);
            });
        }

        // 他のタブやページで言語が変わったときの同期
        window.addEventListener('storage', (e) => {
            if (e.key === 'utaun_lang' && e.newValue) {
                if (langSelect) langSelect.value = e.newValue;
                applyLanguage(e.newValue);
            }
        });
